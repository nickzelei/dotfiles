[tools]
go = "latest"
herdr = "latest"
node = "lts"
uv = "latest"

# CLI tools. Here rather than the Brewfile so Linux boxes (no brew) get them too.
bat = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
hyperfine = "latest"
lazygit = "latest"
ripgrep = "latest"
zoxide = "latest"

# Spelled with the backend because plain `neovim` resolves to a vfox Lua plugin
# that calls the GitHub API itself — it ignores mise's token and records no URL in
# mise.lock, so a fresh box resolves it live and 403s on the anonymous 60/hr limit.
"aqua:neovim/neovim" = "latest"
